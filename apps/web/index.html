<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CifrAI</title>
    <meta name="description" content="Aprenda violão do zero, em lições curtas." />
    <meta name="theme-color" content="#a8330f" />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('cifrai.theme');
          if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
