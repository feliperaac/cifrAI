# Mantem as actions (fixadas por SHA) e as dependencias npm/pnpm atualizadas; sem isso os SHAs envelhecem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00' # America/Rio_Branco (UTC-5) = 11:00 UTC
      timezone: America/Rio_Branco
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Rio_Branco
    open-pull-requests-limit: 5
